<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Crypto Market Scanner</title>
<style>
body{margin:0;background:#0b1020;color:#eef2ff;font-family:system-ui;padding:14px}header{padding:8px 0}h1{font-size:22px;margin:0}.muted{color:#9aa6c2;font-size:12px}button,select{background:#18223a;color:white;border:1px solid #33415f;border-radius:10px;padding:10px;margin:8px 4px 8px 0}.primary{background:#2b63d9}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{background:#121a2e;border:1px solid #25304a;border-radius:14px;padding:12px}.big{font-size:20px;font-weight:700}.green{color:#20c997}.red{color:#ff5c70}.yellow{color:#ffc107}.mtf{margin-top:8px}.table{overflow:auto;margin-top:10px;background:#121a2e;border-radius:14px}table{border-collapse:collapse;min-width:900px;width:100%;font-size:12px}th,td{padding:8px;border-bottom:1px solid #25304a;text-align:right}th:first-child,td:first-child{text-align:left}.err{background:#3a1820;padding:10px;border-radius:10px}@media(max-width:700px){.cards{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Crypto Market Scanner</h1><div class="muted">Binance USDⓈ-M Futures • Top 100 • 15M + 1H + 4H</div></header>
<button id="refresh" class="primary">Refresh now</button><select id="limit"><option>100</option><option>50</option><option>30</option></select>
<div id="status" class="muted">Loading…</div><div id="summary" class="cards"></div><div id="mtf" class="cards mtf"></div><div id="err"></div>
<div class="table"><table><thead><tr><th>Coin</th><th>15M</th><th>1H</th><th>4H</th><th>Price</th><th>EMA30</th><th>MA200</th><th>Vol Ratio</th><th>Signal</th></tr></thead><tbody id="rows"></tbody></table></div>
<p class="muted">UP: Close &gt; EMA30 and MA200. DOWN: Close &lt; EMA30 and MA200. LONG/SHORT also requires EMA trend and volume ratio ≥ 1. Public market data only; no trading.</p>
<script>
const API='https://fapi.binance.com', ints=['15m','1h','4h']; let busy=false,data=[];
const $=x=>document.getElementById(x), fmt=n=>Number.isFinite(n)?(Math.abs(n)>=1?n.toLocaleString(undefined,{maximumFractionDigits:4}):n.toLocaleString(undefined,{maximumSignificantDigits:5})):'-';
const cls=x=>x==='UP'?'green':x==='DOWN'?'red':'yellow';
function sma(a,n){if(a.length<n)return NaN;return a.slice(-n).reduce((x,y)=>x+y,0)/n}
function ema(a,n){if(a.length<n)return NaN;let e=sma(a.slice(0,n),n),k=2/(n+1);for(let i=n;i<a.length;i++)e=a[i]*k+e*(1-k);return e}
async function get(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function symbols(limit){let [i,t]=await Promise.all([get(API+'/fapi/v1/exchangeInfo'),get(API+'/fapi/v1/ticker/24hr')]);let s=new Set(i.symbols.filter(x=>x.status==='TRADING'&&x.contractType==='PERPETUAL'&&x.quoteAsset==='USDT').map(x=>x.symbol));return t.filter(x=>s.has(x.symbol)).sort((a,b)=>+b.quoteVolume-+a.quoteVolume).slice(0,limit).map(x=>x.symbol)}
async function one(s,it){let k=await get(`${API}/fapi/v1/klines?symbol=${s}&interval=${it}&limit=230`),a=k.slice(0,-1),c=a.map(x=>+x[4]),v=a.map(x=>+x[5]),p=c.at(-1),e=ema(c,30),m=sma(c,200),vr=v.at(-1)/sma(v.slice(0,-1),20);let d=p>e&&p>m?'UP':p<e&&p<m?'DOWN':'NEUTRAL',state=d==='UP'&&e>m?'BULLISH':d==='DOWN'&&e<m?'BEARISH':'SIDEWAYS',sig=d==='UP'&&e>m&&vr>=1?'LONG':d==='DOWN'&&e<m&&vr>=1?'SHORT':'WAIT';return{symbol:s,interval:it,price:p,e,m,vr,d,state,sig}}
async function scan(){if(busy)return;busy=true;$('err').innerHTML='';$('status').textContent='Finding top symbols…';try{let ss=await symbols(+$('limit').value),jobs=ss.flatMap(s=>ints.map(it=>[s,it])),done=0;data=[];for(let j=0;j<jobs.length;j+=8){let chunk=jobs.slice(j,j+8);let r=await Promise.all(chunk.map(x=>one(x[0],x[1]).catch(e=>({error:e.message,symbol:x[0],interval:x[1]}))));data.push(...r);done+=r.length;$('status').textContent=`Scanning ${done}/${jobs.length}…`}render();$('status').textContent='Updated '+new Date().toLocaleString()}catch(e){$('err').innerHTML='<div class="err">'+e.message+'</div>';$('status').textContent='Update failed'}finally{busy=false}}
function render(){let good=data.filter(x=>!x.error);$('summary').innerHTML=ints.map(it=>{let a=good.filter(x=>x.interval===it),u=a.filter(x=>x.d==='UP').length,d=a.filter(x=>x.d==='DOWN').length,n=a.length-u-d,up=u/a.length*100,dp=d/a.length*100,b=up>=60?'BULLISH':dp>=60?'BEARISH':up>=50?'MILD BULLISH':dp>=50?'MILD BEARISH':'SIDEWAYS';return `<div class="card"><b>${it.toUpperCase()}</b><div class="big">${b}</div><div class="muted"><span class="green">UP ${u} (${up.toFixed(1)}%)</span> • <span class="red">DOWN ${d} (${dp.toFixed(1)}%)</span> • N ${n}</div></div>`}).join('');
let by={};good.forEach(x=>(by[x.symbol]??={})[x.interval]=x);let sl=0,ss=0;Object.values(by).forEach(v=>{if(ints.every(i=>v[i]?.d==='UP'))sl++;if(ints.every(i=>v[i]?.d==='DOWN'))ss++});$('mtf').innerHTML=`<div class="card"><span class="green">STRONG LONG</span><div class="big">${sl}</div></div><div class="card"><span class="red">STRONG SHORT</span><div class="big">${ss}</div></div><div class="card"><span class="yellow">MIXED / WAIT</span><div class="big">${Object.keys(by).length-sl-ss}</div></div>`;
$('rows').innerHTML=Object.values(by).map(v=>{let a=v['15m']||v['1h']||v['4h'];let sig=[v['15m'],v['1h'],v['4h']].filter(Boolean).map(x=>x.sig).find(x=>x==='LONG')||[v['15m'],v['1h'],v['4h']].filter(Boolean).map(x=>x.sig).find(x=>x==='SHORT')||'WAIT';return `<tr><td>${a.symbol}</td><td class="${cls(v['15m']?.d)}">${v['15m']?.d||'-'}</td><td class="${cls(v['1h']?.d)}">${v['1h']?.d||'-'}</td><td class="${cls(v['4h']?.d)}">${v['4h']?.d||'-'}</td><td>${fmt(a.price)}</td><td>${fmt(a.e)}</td><td>${fmt(a.m)}</td><td>${fmt(a.vr)}</td><td>${sig}</td></tr>`}).join('')}
$('refresh').onclick=scan;scan();setInterval(scan,900000);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
